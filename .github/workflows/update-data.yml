name: Uppdatera champ-data
on:
  schedule:
    - cron: "0 5 * * *"   # varje dag 05:00 UTC
  workflow_dispatch: {}    # kör manuellt från Actions-fliken
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/update_data.py
        env:
          LP_USER: ${{ secrets.LP_USER }}
          LP_PASS: ${{ secrets.LP_PASS }}
      - name: Commit data.json
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Uppdatera data $(date -u +%F)"
          git pull --rebase origin main
          git push
